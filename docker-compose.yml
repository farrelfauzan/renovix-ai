# Development docker-compose
# Usage: docker compose up

services:
  # ─── PostgreSQL with pgvector ───
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: performa
      POSTGRES_PASSWORD: performa_dev
      POSTGRES_DB: performa_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U performa -d performa_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible local storage) ───
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Create default S3 bucket ───
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb local/performa-ai --ignore-existing;
        exit 0;
      "

  # ─── OpenAPI documentation (RX-170) ───
  # The two documents are generated from the code (`bun run openapi:generate`) and committed under
  # docs/openapi/; these services only serve them read-only. "Try it out" is disabled for every
  # method (SUPPORTED_SUBMIT_METHODS=[]): the docs point at production, not at this compose
  # network. Bound to 127.0.0.1 so nothing outside the dev machine can reach them.
  # NOTE: swagger-ui's configurator reads UNPREFIXED env names (URL, SUPPORTED_SUBMIT_METHODS —
  # see /usr/share/nginx/configurator/variables.js in the image); the SWAGGER_UI_* spellings are
  # ignored and the UI would fall back to the petstore example.
  docs-backoffice:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    environment:
      - URL=/backoffice.openapi.json
      - SUPPORTED_SUBMIT_METHODS=[]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./docs/openapi/backoffice.openapi.json:/usr/share/nginx/html/backoffice.openapi.json:ro

  docs-portal:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    environment:
      - URL=/portal.openapi.json
      - SUPPORTED_SUBMIT_METHODS=[]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./docs/openapi/portal.openapi.json:/usr/share/nginx/html/portal.openapi.json:ro

  # ─── Redis (for future caching / rate limiting) ───
  # redis:
  #   image: redis:7-alpine
