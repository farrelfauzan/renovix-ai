          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [topup, usage, refund]
        amount:
          type: string
          description: Amount in USD as decimal string
        status:
          type: string
          enum: [success, pending, failed]
        reference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    UsageList:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/UsageLog"
