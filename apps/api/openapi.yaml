          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReminderRequest"
      responses:
        "200":
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
    delete:
      tags: [Reminders]
      summary: Delete reminder
      operationId: deleteReminder
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Reminder deleted

  # ─── Documents ─────────────────────────────────────────────────────────────
  /export:
    post:
      tags: [Documents]
      summary: Export markdown to document
      operationId: exportDocument
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Document generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentExportResponse"
        "400":
          description: Invalid request

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from /auth/login
    SessionAuth:
      type: http
      scheme: bearer
      bearerFormat: session
      description: Better Auth session token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "API key with Bearer prefix: `Bearer sk_live_*`"
    PortalSessionAuth:
      type: apiKey
      in: header
      name: X-Portal-Session
      description: Portal session token for anonymous/free-tier users

  parameters:
    PortalSessionHeader:
      name: X-Portal-Session
      in: header
      required: true
      schema:
        type: string
      description: Portal session token. Required for all portal endpoints.

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: mypassword123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: mypassword123

    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        apiKey:
          type: string
          description: API key for chat completions (only on register)
          example: sk_live_abc123def456

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        balance:
          type: string
          description: Current balance in USD
        apiKey:
          type: string
        createdAt:
          type: string
          format: date-time

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Model ID from /models endpoint
          example: llama-3.3-70b
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Sampling temperature
        max_tokens:
          type: integer
          minimum: 1
          maximum: 128000
          description: Maximum tokens to generate
        conversation_id:
          type: string
          format: uuid
          description: Optional conversation ID to continue existing chat
        output_format:
          type: string
          enum: [pdf, docx, xlsx]
          description: Optional document output format

    PortalChatCompletionRequest:
      allOf:
        - $ref: "#/components/schemas/ChatCompletionRequest"
        - type: object
          properties:
            model:
              type: string
              description: Model ID (optional for free tier, required for paid)

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: "#/components/schemas/ChatMessage"
              finish_reason:
                type: string
                enum: [stop, length]
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        cost:
          type: object
          properties:
            input:
              type: string
            output:
              type: string
            total:
              type: string

    ChatCompletionError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              example: invalid_request_error
            details:
              type: object

    ModelList:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    Model:
      type: object
      properties:
        id:
          type: string
          example: gpt-oss-20b
        name:
          type: string
        provider:
          type: string
          example: together
        pricing:
          type: object
          properties:
            input:
              type: number
              description: Price per input token (USD, with markup)
              example: 0.0000016
            output:
              type: number
              description: Price per output token (USD, with markup)
              example: 0.0000016
            currency:
              type: string
              example: USD
            unit:
              type: string
              example: per token
        max_tokens:
          type: integer
          example: 128000

    TransactionList:
      type: object
      properties:
