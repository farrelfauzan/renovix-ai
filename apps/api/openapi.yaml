          type: string
          format: uuid
        model:
          type: string
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        cost:
          type: string
          description: Cost in USD as decimal string
        latencyMs:
          type: integer
        createdAt:
          type: string
          format: date-time

    ValidationError:
      type: object
