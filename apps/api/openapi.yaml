openapi: 3.1.0
info:
  title: Renovix AI API
  description: Unified AI platform with multi-LLM API, chat portal, admin dashboard, RAG knowledge base, AI agents, and MCP integrations.
  version: 1.0.0
  contact:
    name: Renovix AI
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.renovix.id/api/v1
    description: Production

security: []

tags:
  - name: Auth
    description: User authentication, profile management, and API key management
  - name: Chat
    description: AI chat completions (OpenAI-compatible)
  - name: Models
    description: Available AI models and pricing
  - name: Billing
    description: Balance, transactions, and checkout
  - name: Usage
    description: API usage logs
  - name: Webhooks
    description: External webhook handlers (Stripe, GOWA)
  - name: Health
    description: Service health check
  - name: Conversations
    description: Chat conversation history
  - name: Knowledge
    description: RAG knowledge base management
  - name: Memory
    description: User memory management (auto-extracted preferences and interests)
  - name: Portal
    description: Chat portal endpoints (free tier and paid user sessions)
  - name: Workspaces
    description: Workspace and team collaboration management
  - name: Channels
    description: Channel/Server management and chat
  - name: Agents
    description: AI Agent creation, configuration, and execution
  - name: MCP
    description: Model Context Protocol integrations and OAuth
  - name: Codes
    description: Invitation code redemption and administration
  - name: Reminders
    description: Scheduled agent reminders and cron jobs
  - name: Documents
    description: Document generation and export (PDF, DOCX, XLSX)

paths:
  # ─── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getProfile
      security:
        - BearerAuth: []
        - SessionAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      tags: [Auth]
      summary: Update current user profile
      operationId: updateProfile
      security:
        - BearerAuth: []
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /auth/keys/regenerate:
    post:
      tags: [Auth]
      summary: Regenerate API key
      operationId: regenerateApiKey
      security:
        - BearerAuth: []
        - SessionAuth: []
      responses:
        "200":
          description: New API key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                    example: sk_live_abc123def456
        "401":
          description: Unauthorized

  /auth/better/{path}:
    get:
      tags: [Auth]
      summary: Better Auth handler (GET)
      description: Forwards requests to Better Auth for SSO (Google/GitHub).
      operationId: betterAuthGet
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auth response
    post:
      tags: [Auth]
      summary: Better Auth handler (POST)
      description: Forwards requests to Better Auth for SSO callbacks.
      operationId: betterAuthPost
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Auth response

  # ─── Chat ──────────────────────────────────────────────────────────────────
  /chat/completions:
    post:
      tags: [Chat]
      summary: Create a chat completion
      description: OpenAI-compatible chat completions endpoint. Requires an API key (sk_live_*).
      operationId: createChatCompletion
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events (SSE) stream of completion chunks
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionError"
        "401":
          description: Invalid or missing API key
        "402":
          description: Insufficient balance

  # ─── Models ────────────────────────────────────────────────────────────────
  /models:
    get:
      tags: [Models]
      summary: List available models
      operationId: listModels
      responses:
        "200":
          description: List of available models with pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"

  # ─── Billing ───────────────────────────────────────────────────────────────
  /billing/balance:
    get:
      tags: [Billing]
      summary: Get current balance
      operationId: getBalance
      security:
        - BearerAuth: []
        - SessionAuth: []
      responses:
        "200":
          description: Current balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: string
                    example: "10.50"
                    description: Balance in USD as a decimal string
        "401":
          description: Unauthorized

  /billing/transactions:
    get:
      tags: [Billing]
      summary: List transactions
      operationId: getTransactions
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
        "401":
          description: Unauthorized

  /billing/checkout:
    post:
      tags: [Billing]
      summary: Create a Stripe checkout session
      operationId: createCheckout
      security:
        - BearerAuth: []
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 5
                  default: 5
                  description: Top-up amount in USD (minimum $5)
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                    description: Stripe Checkout URL to redirect the user to
        "400":
          description: Invalid amount or Stripe not configured
        "401":
          description: Unauthorized
        "503":
          description: Stripe temporarily disabled

  # ─── Usage ─────────────────────────────────────────────────────────────────
  /usage:
    get:
      tags: [Usage]
      summary: Get API usage logs
      operationId: getUsage
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: model
          in: query
          schema:
            type: string
          description: Filter by model ID
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
          description: Filter usage from this date
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
          description: Filter usage until this date
      responses:
        "200":
          description: Paginated usage logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageList"
        "401":
          description: Unauthorized

  # ─── Webhooks ──────────────────────────────────────────────────────────────
  /webhooks/stripe:
    get:
      tags: [Webhooks]
      summary: Webhook health check
      operationId: webhookHealthCheck
      responses:
        "200":
          description: Webhook status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  configured:
                    type: boolean
    post:
      tags: [Webhooks]
      summary: Stripe webhook endpoint
      description: Receives Stripe events. Requires stripe-signature header for verification.
      operationId: handleStripeWebhook
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Event received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          description: Invalid signature or missing configuration

  /webhooks/gowa:
    post:
      tags: [Webhooks]
      summary: GOWA WhatsApp webhook endpoint
      description: Receives inbound WhatsApp messages from GOWA and routes them to configured agents.
      operationId: handleGowaWebhook
      parameters:
        - name: x-gowa-signature
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GowaInboundMessage"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid signature or payload

  # ─── Health ────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  database:
                    type: string
                    enum: [connected, disconnected]

  # ─── Conversations ─────────────────────────────────────────────────────────
  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      operationId: listConversations
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "401":
          description: Unauthorized

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get a conversation with messages
      operationId: getConversation
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          description: Unauthorized
        "404":
          description: Conversation not found
    delete:
      tags: [Conversations]
      summary: Delete a conversation
      operationId: deleteConversation
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Conversation deleted
        "401":
          description: Unauthorized
        "404":
          description: Conversation not found

  # ─── Knowledge ─────────────────────────────────────────────────────────────
  /v1/knowledge/bases:
    post:
      tags: [Knowledge]
      summary: Create a knowledge base
      operationId: createKnowledgeBase
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "201":
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
    get:
      tags: [Knowledge]
      summary: List knowledge bases
      operationId: listKnowledgeBases
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: List of knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
        "401":
          description: Unauthorized

  /v1/knowledge/bases/{id}:
    get:
      tags: [Knowledge]
      summary: Get a knowledge base
      operationId: getKnowledgeBase
      security:
        - ApiKeyAuth:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Knowledge base details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "401":
          description: Unauthorized
        "404":
          description: Knowledge base not found
    put:
      tags: [Knowledge]
      summary: Update a knowledge base
      operationId: updateKnowledgeBase
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeBaseRequest"
      responses:
        "200":
          description: Knowledge base updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: Knowledge base not found
    delete:
      tags: [Knowledge]
      summary: Delete a knowledge base
      operationId: deleteKnowledgeBase
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Knowledge base deleted
        "401":
          description: Unauthorized
        "404":
          description: Knowledge base not found

  /v1/knowledge/bases/{id}/upload:
    post:
      tags: [Knowledge]
      summary: Upload a markdown file to a knowledge base
      description: Uploads a .md file, chunks it, generates embeddings, and stores in the knowledge base. Rate limited to 5 requests per minute.
      operationId: uploadMarkdown
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Markdown file (.md, max 10MB)
      responses:
        "200":
          description: File processed and chunks created
          content:
            application/json:
              schema:
                type: object
                properties:
                  chunksCreated:
                    type: integer
                  s3Key:
                    type: string
        "400":
          description: Invalid file (not .md or exceeds size limit)
        "401":
          description: Unauthorized
        "429":
          description: Rate limit exceeded

  /v1/knowledge/bases/{id}/chunks:
    post:
      tags: [Knowledge]
      summary: Add text chunks to a knowledge base
      description: Manually add text chunks with optional metadata. Rate limited to 10 requests per minute.
      operationId: addChunks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddChunksRequest"
      responses:
        "201":
          description: Chunks added
          content:
            application/json:
              schema:
                type: object
                properties:
                  chunksCreated:
                    type: integer
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "429":
          description: Rate limit exceeded
    get:
      tags: [Knowledge]
      summary: List chunks in a knowledge base
      operationId: listChunks
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkList"
        "401":
          description: Unauthorized

  /v1/knowledge/bases/{id}/chunks/{chunkId}:
    delete:
      tags: [Knowledge]
      summary: Delete a chunk
      operationId: deleteChunk
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chunkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Chunk deleted
        "401":
          description: Unauthorized
        "404":
          description: Chunk not found

  /v1/knowledge/search:
    post:
      tags: [Knowledge]
      summary: Search knowledge base chunks by semantic similarity
      operationId: searchKnowledgeChunks
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchChunksRequest"
      responses:
        "200":
          description: Search results ranked by similarity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /v1/admin/system-kb/sync:
    post:
      tags: [Knowledge]
      summary: Trigger system knowledge base sync
      operationId: syncSystemKnowledge
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Unauthorized

  # ─── Portal ────────────────────────────────────────────────────────────────
  /chat/portal/completions:
    post:
      tags: [Portal]
      summary: Create a portal chat completion
      description: Handles both free-tier (rate-limited, cheapest model) and paid-tier (user balance) chat completions with SSE streaming.
      operationId: createPortalCompletion
      security:
        - PortalSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events (SSE) stream of completion chunks, status updates, and document metadata
        "400":
          description: Invalid request or rate limit reached
        "401":
          description: Unauthorized

  /chat/portal/usage:
    get:
      tags: [Portal]
      summary: Get portal usage statistics
      operationId: getPortalUsage
      security:
        - PortalSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
      responses:
        "200":
          description: Portal usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestsUsed:
                    type: integer
                  requestsLimit:
                    type: integer
                  balance:
                    type: string
                    nullable: true
        "400":
          description: Authentication required

  /chat/portal/models:
    get:
      tags: [Portal]
      summary: Get available models for portal
      operationId: getPortalModels
      security:
        - PortalSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
      responses:
        "200":
          description: List of available models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        name:
                          type: string
                        inputPrice:
                          type: string
                        outputPrice:
                          type: string
        "400":
          description: Authentication required

  /chat/portal/link-session:
    post:
      tags: [Portal]
      summary: Link portal session to authenticated user
      description: Associates the current anonymous portal session with the authenticated user account.
      operationId: linkPortalSession
      security:
        - PortalSessionAuth: []
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
      responses:
        "200":
          description: Session linked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked:
                    type: boolean
                    example: true
        "400":
          description: Authentication required

  /chat/portal/conversations:
    get:
      tags: [Portal]
      summary: List portal conversations
      operationId: listPortalConversations
      security:
        - PortalSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
        "400":
          description: Authentication required

  /chat/portal/conversations/{id}:
    get:
      tags: [Portal]
      summary: Get a portal conversation
      operationId: getPortalConversation
      security:
        - PortalSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "400":
          description: Authentication required
        "404":
          description: Conversation not found
    delete:
      tags: [Portal]
      summary: Delete a portal conversation
      operationId: deletePortalConversation
      security:
        - PortalSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Conversation deleted
        "400":
          description: Authentication required
        "404":
          description: Conversation not found

  /chat/portal/knowledge:
    get:
      tags: [Portal]
      summary: List portal knowledge bases
      operationId: listPortalKnowledgeBases
      security:
        - PortalSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
      responses:
        "200":
          description: List of knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Authentication required or top-up needed
    post:
      tags: [Portal]
      summary: Create a portal knowledge base
      operationId: createPortalKnowledgeBase
      security:
        - PortalSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/PortalSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
