name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      chat: ${{ steps.filter.outputs.chat }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'prisma/**'
              - 'libs/**'
              - 'package.json'
              - 'tsconfig.base.json'
            chat:
              - 'apps/chat/**'
              - 'libs/**'
              - 'package.json'
              - 'tsconfig.base.json'
            landing:
              - 'apps/landing/**'
              - 'libs/**'
              - 'package.json'
              - 'tsconfig.base.json'

  build-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image (no push)
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t renovix/api:test \
            .

  build-chat:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Chat Docker image (no push)
        run: |
          docker build \
            -f apps/chat/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.renovix.id/api/v1 \
            -t renovix/chat:test \
            .

  build-landing:
    needs: detect-changes
    if: needs.detect-changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Landing Docker image (no push)
        run: |
          docker build \
            -f apps/landing/Dockerfile \
            -t renovix/landing:test \
            .
