steps:
  # ─── Build API ───
  - id: 'build-api'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/api/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:latest'
      - '.'

  # ─── Build Chat ───
  - id: 'build-chat'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/chat/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://api.${_DOMAIN}/api/v1'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:latest'
      - '.'
    waitFor: ['-']

  # ─── Build Landing ───
  - id: 'build-landing'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/landing/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:${_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:latest'
      - '.'
    waitFor: ['-']

  # ─── Push All Images ───
  - id: 'push-images'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:${_TAG} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:latest &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:${_TAG} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:latest &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:${_TAG} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:latest &
        wait
    waitFor: ['build-api', 'build-chat', 'build-landing']

  # ─── Deploy API to Cloud Run ───
  - id: 'deploy-api'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'renovix-api'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:${_TAG}'
      - '--region'
      - '${_REGION}'
    waitFor: ['push-images']

  # ─── Deploy Chat to Cloud Run ───
  - id: 'deploy-chat'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'renovix-chat'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:${_TAG}'
      - '--region'
      - '${_REGION}'
    waitFor: ['push-images']

  # ─── Deploy Landing to Cloud Run ───
  - id: 'deploy-landing'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'renovix-landing'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:${_TAG}'
      - '--region'
      - '${_REGION}'
    waitFor: ['push-images']

substitutions:
  _REGION: 'asia-southeast2'
  _DOMAIN: 'renovix.id'
  _TAG: '${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
